<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axiom — preview</title>
    <link rel="stylesheet" href="/preview.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <span class="brand-mark">◈</span>
        <h1>Axiom</h1>
        <p class="tagline">describe what you want — get a scoped task</p>
      </header>

      <section class="intake">
        <textarea id="request" rows="3" placeholder="e.g. make the login less confusing; add rate limiting; stop the tests crashing">make auth better</textarea>
        <div class="intake-bar">
          <label class="mode">
            <input type="checkbox" id="interrogate" checked />
            ask questions when ambiguous
          </label>
          <button class="compile" id="compile">Compile intent</button>
        </div>
      </section>

      <section id="status" class="status" hidden></section>
      <section id="gate" class="gate" hidden></section>
      <section id="result" class="result" hidden></section>
    </main>
    <script src="/preview.js"></script>
  </body>
</html>
