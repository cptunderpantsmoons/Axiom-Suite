global:
  scrape_interval: 15s

# The proxy serves Prometheus metrics at /metrics on its HTTP port (8080 by
# default); the manager does the same on 8090. `host.docker.internal` resolves
# to the host from inside the `prometheus` compose container (see
# docker-compose.yml `extra_hosts`, which maps it on Linux too).
scrape_configs:
  - job_name: management-harness
    static_configs:
      - targets:
          - "host.docker.internal:8080"
          - "host.docker.internal:8090"