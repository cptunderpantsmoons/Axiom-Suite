<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContextLock Progress</title>
  <style>
    :root {
      color-scheme: dark;

      /* Primitive tokens — color palette */
      --gray-900: #0f1220;
      --gray-800: #171b2e;
      --gray-700: #27304a;
      --indigo-300: #7aa2ff;
      --bluegray-200: #98a2c7;
      --text-100: #e8ecff;
      --green-400: #39d98a;
      --amber-400: #ffcc66;
      --red-400: #ff6b6b;

      /* Primitive tokens — spacing scale */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;

      /* Primitive tokens — typography */
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --text-xs: 0.8rem;
      --text-sm: 0.85rem;
      --text-base: 1rem;
      --text-lg: 1.5rem;
      --line-base: 1.5;

      /* Primitive tokens — radii */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;

      /* Primitive tokens — elevation */
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);

      /* Semantic tokens — surface & text */
      --bg: var(--gray-900);
      --panel: var(--gray-800);
      --border: var(--gray-700);
      --text: var(--text-100);
      --muted: var(--bluegray-200);
      --accent: var(--indigo-300);

      /* Semantic tokens — status */
      --good: var(--green-400);
      --warn: var(--amber-400);
      --bad: var(--red-400);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: var(--line-base);
      padding: var(--space-6);
    }

    h1 { font-size: var(--text-lg); margin: var(--space-1) 0 var(--space-4); }
    p { margin: var(--space-1) 0 var(--space-4); }

    a { color: var(--accent); text-decoration: none; }

    code {
      background: rgba(255, 255, 255, 0.06);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    .grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5);
      box-shadow: var(--shadow-1);
    }

    .card h2 { margin: var(--space-1) 0 var(--space-4); }

    .badge {
      display: inline-flex;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      border: 1px solid var(--border);
    }
    .badge-good { background: rgba(57, 217, 138, 0.15); color: var(--good); }
    .badge-warn { background: rgba(255, 204, 102, 0.15); color: var(--warn); }
    .badge-bad { background: rgba(255, 107, 107, 0.15); color: var(--bad); }
    .badge-neutral { background: rgba(122, 162, 255, 0.12); color: var(--accent); }

    .muted { color: var(--muted); }

    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
  </style>
</head>
<body>
  <h1>ContextLock Planning &amp; Progress</h1>
  <p>Source: <code>docs/planning/contextlock-progress.json</code></p>

  <div class="grid">
    <section class="card">
      <h2>Overall</h2>
      <div id="overall">Loading…</div>
    </section>
    <section class="card">
      <h2>Specs</h2>
      <ul id="specs"></ul>
    </section>
    <section class="card">
      <h2>Build Phases</h2>
      <ul id="builds"></ul>
    </section>
    <section class="card">
      <h2>Guardrails</h2>
      <ul id="guardrails"></ul>
    </section>
  </div>

  <script>
    const TONE = {
      done: 'good', validated: 'good', in_progress: 'warn', blocked: 'bad'
    };
    function badge(text, tone) {
      const span = document.createElement('span');
      span.className = `badge badge-${tone || 'neutral'}`;
      span.textContent = text;
      return span;
    }
    async function main() {
      const res = await fetch('./contextlock-progress.json');
      const data = await res.json();

      const doneSpecs = data.specs.filter(s => s.status === 'done').length;
      document.getElementById('overall').textContent = `${doneSpecs}/${data.specs.length} specs ready; strict anti-drift mode: ${data.quality_gate_policy.mode}`;

      const specsEl = document.getElementById('specs');
      data.specs.forEach(s => {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(`${s.id} — `));
        li.appendChild(badge(s.status, TONE[s.status]));
        li.appendChild(document.createTextNode(` (${s.path})`));
        specsEl.appendChild(li);
      });

      const buildsEl = document.getElementById('builds');
      data.builds.forEach(b => {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(`Build ${b.id}: ${b.name} — `));
        li.appendChild(badge(b.status, TONE[b.status]));
        buildsEl.appendChild(li);
      });

      const guardEl = document.getElementById('guardrails');
      const enforcement = data.guardrails.enforcement || data.guardrails.active_enforcement || {};
      Object.entries(enforcement).forEach(([k, v]) => {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(`${k}: `));
        li.appendChild(badge(v, v === 'fail' ? 'bad' : v === 'warn' ? 'warn' : 'neutral'));
        guardEl.appendChild(li);
      });
    }
    main().catch(err => {
      document.getElementById('overall').textContent = `Failed to load progress data: ${err.message}`;
    });
  </script>
</body>
</html>
